<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duo Budget — Private</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FBF7EF">
  <style>
    :root { --bg:#FBF7EF; --text:#1F2430; --muted:#5B6170; --cyan:#0E7490; --teal:#0F766E; --line:#E6DDCC; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
      background: radial-gradient(120% 60% at 100% 0%, rgba(14,116,144,.13), transparent 60%), var(--bg);
      color:var(--text); padding:24px; }
    .card { max-width:400px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:32px 28px;
      box-shadow:0 18px 50px rgba(31,36,48,.06); text-align:center; }
    h1 { font-size:22px; margin:0 0 10px; letter-spacing:-.02em; }
    p { color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 18px; }
    a { color:var(--cyan); font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>App is private for now</h1>
    <p>The Duo Budget app isn’t publicly available yet. Join the waitlist on the homepage and we’ll let you know when it opens.</p>
    <a href="/">← Back to waitlist</a>
  </main>
</body>
</html>
